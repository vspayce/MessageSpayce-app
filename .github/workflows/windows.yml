name: Windows build
on:
  push:
    branches: [ messagespayce ]
  workflow_dispatch:

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.0
          cache: true

      - name: Install Protobuf compiler
        run: choco install protoc -y

      - name: Set up placeholder Fairplay keys
        shell: bash
        run: |
          mkdir -p rustpush/certs/fairplay
          for name in 4056631661436364584235346952193 4056631661436364584235346952194 \
                      4056631661436364584235346952195 4056631661436364584235346952196 \
                      4056631661436364584235346952197 4056631661436364584235346952198 \
                      4056631661436364584235346952199 4056631661436364584235346952200 \
                      4056631661436364584235346952201 4056631661436364584235346952208; do
            cp rustpush/certs/legacy-fairplay/fairplay.pem rustpush/certs/fairplay/$name.pem
            cp rustpush/certs/legacy-fairplay/fairplay.crt rustpush/certs/fairplay/$name.crt
          done

      - name: Build
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath messagespayce-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: messagespayce-windows-x64
          path: messagespayce-windows-x64.zip
